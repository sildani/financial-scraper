# Runs the same checks as CI, with the tools pinned in requirements-dev.txt; run with the venv active.
# Every commit runs them all, since a config change alone can break a check.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        always_run: true
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        always_run: true
        pass_filenames: false
      - id: unittest
        name: unit tests
        entry: python -m unittest discover -s tests -t .
        language: system
        always_run: true
        pass_filenames: false
