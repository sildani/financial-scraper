name: checks

on:
  # Other branches are checked by pull_request, so pushing to one doesn't run the job twice
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check
      - run: pyright
      # No credentials here: the integration tests skip themselves
      - run: python -m unittest discover -s tests -t .
