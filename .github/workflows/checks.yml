name: checks

on:
  # Other branches are checked by pull_request, so pushing to one doesn't run the job twice
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A hung run fails in minutes, not GitHub's default 6 hours
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # The same .venv the pre-commit hooks run from
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      # No credentials here: the integration tests skip themselves
      - run: .venv/bin/pre-commit run --all-files --show-diff-on-failure
